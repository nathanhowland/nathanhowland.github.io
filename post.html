<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post &mdash; Nathan Howland</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav id="nav">
        <div class="nav-inner">
            <a class="nav-logo" href="index.html">Nathan Howland</a>
            <button class="nav-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#contact">Contact</a></li>
                <li><a href="music.html">Music</a></li>
                <li class="nav-blog"><a href="blog.html">Blog</a></li>
            </ul>
        </div>
    </nav>

    <section class="section">
        <div class="container">
            <a href="blog.html" class="post-back">&larr; Back to Blog</a>
            <div class="post-header">
                <time id="post-date"></time>
                <h1 id="post-title">Loading&hellip;</h1>
            </div>
            <div id="post-body" class="post-body"></div>
            <a href="blog.html" class="post-back post-back-bottom">&larr; Back to Blog</a>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script>
        function formatDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
        }

        const params = new URLSearchParams(window.location.search);
        const slug = params.get('post');

        if (!slug) {
            window.location.href = 'blog.html';
        } else {
            Promise.all([
                fetch('blog/posts/posts.json').then(r => r.json()),
                fetch('blog/posts/' + slug + '/post.txt').then(r => r.text())
            ]).then(function(results) {
                const posts = results[0];
                const text = results[1];
                const meta = posts.find(function(p) { return p.slug === slug; }) || {};
                const imagesDir = 'blog/posts/' + slug + '/images/';

                document.title = (meta.title || 'Post') + ' — Nathan Howland';
                document.getElementById('post-title').textContent = meta.title || slug;
                if (meta.date) {
                    document.getElementById('post-date').textContent = formatDate(meta.date);
                }

                const body = document.getElementById('post-body');
                text.trim().split(/\n\n+/).forEach(function(block) {
                    const trimmed = block.trim();
                    if (!trimmed) return;

                    // Image tag: [image: filename.jpg] or [image: filename.jpg | caption]
                    const imgMatch = trimmed.match(/^\[image:\s*([^\]|]+?)(?:\|\s*([^\]]*))?\]$/i);
                    if (imgMatch) {
                        const figure = document.createElement('figure');
                        figure.className = 'post-figure';
                        const img = document.createElement('img');
                        img.src = imagesDir + imgMatch[1].trim();
                        img.alt = imgMatch[2] ? imgMatch[2].trim() : '';
                        img.className = 'post-img';
                        figure.appendChild(img);
                        if (imgMatch[2] && imgMatch[2].trim()) {
                            const cap = document.createElement('figcaption');
                            cap.textContent = imgMatch[2].trim();
                            figure.appendChild(cap);
                        }
                        body.appendChild(figure);
                        return;
                    }

                    // Image pair tag: [imagepair: a.jpg | b.jpg]
                    const pairMatch = trimmed.match(/^\[imagepair:\s*([^\]|]+?)\s*\|\s*([^\]|]+?)\]$/i);
                    if (pairMatch) {
                        const wrap = document.createElement('div');
                        wrap.className = 'post-imagepair';
                        [pairMatch[1], pairMatch[2]].forEach(function(name) {
                            const img = document.createElement('img');
                            img.src = imagesDir + name.trim();
                            img.alt = '';
                            wrap.appendChild(img);
                        });
                        body.appendChild(wrap);
                        return;
                    }

                    // Video tag: [video: path/to/file.mov] or [video: path | caption]
                    const videoMatch = trimmed.match(/^\[video:\s*([^\]|]+?)(?:\|\s*([^\]]*))?\]$/i);
                    if (videoMatch) {
                        const figure = document.createElement('figure');
                        figure.className = 'post-figure';
                        const video = document.createElement('video');
                        video.src = videoMatch[1].trim();
                        video.className = 'post-video';
                        video.controls = true;
                        video.preload = 'metadata';
                        video.playsInline = true;
                        figure.appendChild(video);
                        if (videoMatch[2] && videoMatch[2].trim()) {
                            const cap = document.createElement('figcaption');
                            cap.textContent = videoMatch[2].trim();
                            figure.appendChild(cap);
                        }
                        body.appendChild(figure);
                        return;
                    }

                    // Instagram embed: [instagram: url] or [instagram: url | caption]
                    const igMatch = trimmed.match(/^\[instagram:\s*([^\]|]+?)(?:\|\s*([^\]]*))?\]$/i);
                    if (igMatch) {
                        const shortcodeMatch = igMatch[1].trim().match(/\/(p|reel|tv)\/([^/?]+)/);
                        if (shortcodeMatch) {
                            const figure = document.createElement('figure');
                            figure.className = 'post-figure';
                            const wrap = document.createElement('div');
                            wrap.className = 'media-instagram-wrap';
                            const iframe = document.createElement('iframe');
                            iframe.src = 'https://www.instagram.com/' + shortcodeMatch[1] + '/' + shortcodeMatch[2] + '/embed';
                            iframe.allowFullscreen = true;
                            wrap.appendChild(iframe);
                            figure.appendChild(wrap);
                            if (igMatch[2] && igMatch[2].trim()) {
                                const cap = document.createElement('figcaption');
                                cap.textContent = igMatch[2].trim();
                                figure.appendChild(cap);
                            }
                            body.appendChild(figure);
                            return;
                        }
                    }

                    // Gallery tag: [gallery: a.jpg, b.jpg, c.jpg]
                    const galleryMatch = trimmed.match(/^\[gallery:\s*([^\]]+)\]$/i);
                    if (galleryMatch) {
                        const grid = document.createElement('div');
                        grid.className = 'post-gallery';
                        galleryMatch[1].split(',').forEach(function(name) {
                            const trimmedName = name.trim();
                            if (!trimmedName) return;
                            const img = document.createElement('img');
                            img.src = imagesDir + trimmedName;
                            img.alt = '';
                            img.loading = 'lazy';
                            grid.appendChild(img);
                        });
                        body.appendChild(grid);
                        return;
                    }

                    const p = document.createElement('p');
                    p.textContent = trimmed.replace(/\n/g, ' ');
                    body.appendChild(p);
                });
            }).catch(function() {
                document.getElementById('post-title').textContent = 'Post not found';
                document.getElementById('post-body').innerHTML = '<p>Could not load this post.</p>';
            });
        }
    </script>
</body>
</html>
